name: 洛雪移动版 32位APK 自动构建

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '*.md'
  workflow_dispatch:
    inputs:
      abi:
        description: 'CPU 架构（32位 ARM = armeabi-v7a）'
        type: choice
        options: [armeabi-v7a, arm64-v8a, x86, x86_64]
        default: armeabi-v7a
      build_type:
        description: 'release 含 JS bundle，装手机可直接运行（默认）；debug 需连 Metro，仅调试用'
        type: choice
        options: [release, debug]
        default: release
      base_ref:
        description: '仅当 zip 不含完整 android 工程时，用于补齐的官方分支/tag'
        default: 'master'
      source_tag:
        description: '(可选) 源码 zip 作为某个 Release 附件上传时，填该 tag'
        default: ''

permissions:
  contents: write

concurrency:
  group: lx-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ABI: ${{ inputs.abi || 'armeabi-v7a' }}
      BUILD_TYPE: ${{ inputs.build_type || 'release' }}
      BASE_REF: ${{ inputs.base_ref || 'master' }}
      SOURCE_TAG: ${{ inputs.source_tag || '' }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 定位并解压定制源码（自动修中文/GBK 路径）
        id: locate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ZIP=""
          for f in *.zip; do
            [ -f "$f" ] || continue
            case "$f" in
              *洛雪*|*lx*|*LX*|*定制*|*v1.9*) ZIP="$f"; break;;
            esac
          done
          if [ -z "$ZIP" ]; then
            for f in *.zip; do [ -f "$f" ] && { ZIP="$f"; break; }; done
          fi
          if [ -z "$ZIP" ] && [ -n "$SOURCE_TAG" ]; then
            gh release download "$SOURCE_TAG" --pattern '*.zip' --dir . --clobber || true
            for f in *.zip; do [ -f "$f" ] && { ZIP="$f"; break; }; done
          fi
          if [ -z "$ZIP" ]; then
            gh release download --pattern '*.zip' --dir . --clobber || true
            for f in *.zip; do [ -f "$f" ] && { ZIP="$f"; break; }; done
          fi
          [ -n "$ZIP" ] || { echo "::error::未找到定制源码 zip。请把「洛雪音乐移动版_定制源码_v1.9.2.zip」上传到仓库根目录，或作为 Release 附件上传"; exit 1; }
          echo "使用源码包: $ZIP"
          python3 - "$ZIP" <<'PY'
          import sys, zipfile, os, shutil
          z = zipfile.ZipFile(sys.argv[1])
          out = os.path.abspath('src_tmp')
          shutil.rmtree(out, ignore_errors=True)
          os.makedirs(out)
          for info in z.infolist():
              name = info.filename
              if not (info.flag_bits & 0x800):
                  try:
                      name = name.encode('cp437').decode('gbk')
                  except Exception:
                      pass
              name = name.replace('\\', '/')
              parts = [p for p in name.split('/') if p not in ('', '.', '..')]
              if not parts:
                  continue
              target = os.path.join(out, *parts)
              if info.is_dir():
                  os.makedirs(target, exist_ok=True)
                  continue
              os.makedirs(os.path.dirname(target), exist_ok=True)
              with z.open(info) as s, open(target, 'wb') as d:
                  shutil.copyfileobj(s, d)
          print('解压完成')
          PY
          INNER=$(python3 - <<'PY'
          import os
          root = os.path.abspath('src_tmp')
          hits = [d for d, _, f in os.walk(root) if 'package.json' in f]
          hits.sort(key=lambda p: (p.count(os.sep), len(p)))
          print(hits[0] if hits else '')
          PY
          )
          [ -n "$INNER" ] || { echo "::error::zip 里找不到 package.json，不是完整的 RN 工程"; exit 1; }
          rm -rf "$GITHUB_WORKSPACE/app"
          mv "$INNER" "$GITHUB_WORKSPACE/app"
          rm -rf src_tmp
          # react-native-quick-base64 等 C++ 原生模块不能在中文路径下编译
          python3 - <<'PY'
          import os, sys
          p = os.path.abspath('app')
          try:
              p.encode('ascii')
          except UnicodeEncodeError:
              print('::error::工程路径含非 ASCII 字符，请把 GitHub 仓库名改成英文（例如 lx-music-build）')
              sys.exit(1)
          print('工程路径(纯ASCII):', p)
          PY
          echo "src=app" >> "$GITHUB_OUTPUT"

      - name: 必要时补齐原生工程骨架（只补缺失，绝不覆盖定制源码）
        working-directory: app
        run: |
          set -euo pipefail
          NEED=0
          [ -f android/gradlew ] || NEED=1
          [ -f android/gradle/wrapper/gradle-wrapper.jar ] || NEED=1
          [ -f package.json ] || NEED=1
          if [ "$NEED" = "0" ]; then echo "zip 自带完整 android 工程，直接构建"; exit 0; fi
          echo "zip 缺原生骨架，从官方源码补齐"
          # 优先用与定制源码同版本号的官方 tag，避免 master 骨架与旧版 JS 依赖错配
          VER=$(python3 -c "import json; print(json.load(open('package.json', encoding='utf-8')).get('version',''))" 2>/dev/null || true)
          echo "定制源码版本号: ${VER:-未知}"
          BASE_OK=0
          for REF in ${VER:+v$VER $VER} "$BASE_REF" master; do
            [ -n "$REF" ] || continue
            if curl -fsSL "https://codeload.github.com/lyswhut/lx-music-mobile/zip/refs/tags/$REF" -o /tmp/base.zip 2>/dev/null; then
              echo "骨架来源: tag $REF"; BASE_OK=1; break
            fi
            if curl -fsSL "https://codeload.github.com/lyswhut/lx-music-mobile/zip/refs/heads/$REF" -o /tmp/base.zip 2>/dev/null; then
              echo "骨架来源: branch $REF"; BASE_OK=1; break
            fi
          done
          [ "$BASE_OK" = "1" ] || { echo "::error::官方骨架下载失败，检查 base_ref"; exit 1; }
          rm -rf /tmp/base && mkdir -p /tmp/base
          unzip -q -o /tmp/base.zip -d /tmp/base
          BASE=$(python3 - <<'PY'
          import os
          hits = [d for d, _, f in os.walk('/tmp/base') if 'package.json' in f]
          hits.sort(key=lambda p: (p.count(os.sep), len(p)))
          print(hits[0] if hits else '')
          PY
          )
          [ -n "$BASE" ] || { echo "::error::官方骨架下载失败，检查 base_ref"; exit 1; }
          mkdir -p android/gradle/wrapper
          cp -rn "$BASE/android/." android/ 2>/dev/null || true
          [ -f gradlew ] || cp -n "$BASE/gradlew" ./gradlew
          [ -d gradle ] || cp -rn "$BASE/gradle" ./gradle
          [ -f package.json ] || cp -n "$BASE/package.json" ./package.json
          [ -f android/gradle/wrapper/gradle-wrapper.jar ] || \
            cp -n "$BASE/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/
          chmod +x gradlew android/gradlew 2>/dev/null || true
          [ -f android/gradlew ] && [ -f android/gradle/wrapper/gradle-wrapper.jar ] || \
            { echo "::error::原生骨架补齐失败"; exit 1; }
          echo "原生骨架补齐完成（定制源码未覆盖）"

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 npm 依赖
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('app/package-lock.json', 'app/package.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: 安装 JS 依赖
        working-directory: app
        run: |
          set -e
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npm run sync-app-name || true
          [ -d node_modules/react-native ] || { echo "::error::node_modules 里没有 react-native，JS 依赖没装全"; exit 1; }

      # RN 的 debug 构建默认 bundleInDebug=false，APK 内没有 assets/index.android.bundle，
      # 手机没有 Metro 就会红屏 "Unable to load script"。debug 分支显式补打一份。
      - name: 预打 JS bundle（debug 专属；release 由 Gradle 自动打）
        if: env.BUILD_TYPE == 'debug'
        working-directory: app
        run: |
          set -euo pipefail
          ENTRY=$(python3 - <<'PY'
          import json, os
          p = json.load(open('package.json', encoding='utf-8'))
          for c in [p.get('main') or '', 'index.js', 'index.android.js', 'src/index.js', 'src/main.js']:
              if c and os.path.isfile(c):
                  print(c); break
          else:
              print('index.js')
          PY
          )
          echo "入口文件: $ENTRY"
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file "$ENTRY" --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/
          test -s android/app/src/main/assets/index.android.bundle || { echo "::error::JS bundle 生成失败或为空"; exit 1; }
          ls -lh android/app/src/main/assets/index.android.bundle

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 补齐 Android SDK 组件
        run: |
          set -e
          SDKM=$(find "$ANDROID_HOME" -path '*/cmdline-tools/*/bin/sdkmanager' 2>/dev/null | head -1 || true)
          if [ -z "$SDKM" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmd.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            unzip -q -o /tmp/cmd.zip -d /tmp/cmd
            mv /tmp/cmd/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;26.1.10909125" "cmake;3.22.1"

      # 官方 android/app/build.gradle 在「配置阶段」无条件读取 keystore.properties，
      # debug 构建同样会因文件缺失抛 FileNotFoundException，所以两种构建类型都必须执行本步。
      - name: 准备签名配置（debug / release 均需，零 Secrets 也能跑）
        id: prep
        working-directory: app/android
        env:
          LX_KEYSTORE_B64: ${{ secrets.LX_KEYSTORE_B64 }}
        run: |
          set -e
          KS="$PWD/app/lx-release.keystore"
          if [ -n "$LX_KEYSTORE_B64" ]; then
            echo "$LX_KEYSTORE_B64" | base64 -d > "$KS"
            echo "generated=0" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore "$KS" -alias lxkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass lxci2026 -keypass lxci2026 \
              -dname "CN=LX Music CI, OU=CI, O=Self, L=Shenzhen, ST=GD, C=CN"
            echo "generated=1" >> "$GITHUB_OUTPUT"
          fi
          printf 'storeFile=%s\nstorePassword=lxci2026\nkeyAlias=lxkey\nkeyPassword=lxci2026\nMYAPP_UPLOAD_STORE_FILE=%s\nMYAPP_UPLOAD_STORE_PASSWORD=lxci2026\nMYAPP_UPLOAD_KEY_ALIAS=lxkey\nMYAPP_UPLOAD_KEY_PASSWORD=lxci2026\n' \
            "$KS" "$KS" > keystore.properties
          # 编译前硬断言：文件存在、非空、含 storeFile，且指向的 keystore 真实可读
          test -s keystore.properties || { echo "::error::keystore.properties 未生成"; exit 1; }
          test -f "$KS"               || { echo "::error::签名库不存在: $KS"; exit 1; }
          grep -q '^storeFile=' keystore.properties || { echo "::error::keystore.properties 缺 storeFile"; exit 1; }
          echo "签名配置就绪: $PWD/keystore.properties -> $KS"
          echo "ks=$KS" >> "$GITHUB_OUTPUT"

      - name: 编译 APK（默认只编 32 位）
        working-directory: app/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          touch gradle.properties
          python3 - <<'PY'
          import os
          p = 'gradle.properties'
          keys = ('reactNativeArchitectures=', 'org.gradle.jvmargs=')
          with open(p, encoding='utf-8') as f:
              lines = [l for l in f if not l.startswith(keys)]
          lines.append('reactNativeArchitectures=%s\n' % os.environ['ABI'])
          # GitHub runner 约 7GB；RN 全量编译默认堆容易 OOM
          lines.append('org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n')
          with open(p, 'w', encoding='utf-8') as f:
              f.writelines(lines)
          PY
          ARGS="--no-daemon --stacktrace -PreactNativeArchitectures=$ABI"
          if [ "$BUILD_TYPE" = "release" ]; then
            KS='${{ steps.prep.outputs.ks }}'
            ARGS="$ARGS assembleRelease -PMYAPP_UPLOAD_STORE_FILE=$KS -PMYAPP_UPLOAD_STORE_PASSWORD=lxci2026 -PMYAPP_UPLOAD_KEY_ALIAS=lxkey -PMYAPP_UPLOAD_KEY_PASSWORD=lxci2026"
          else
            ARGS="$ARGS assembleDebug"
          fi
          echo "构建命令: ./gradlew $ARGS"
          printf '%s\n' "$ARGS" > "$GITHUB_WORKSPACE/gradle-args.txt"
          set +e
          ./gradlew $ARGS 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::error::Gradle 退出码 $RC；完整日志已保存，下一步会自动把关键错误写进本页摘要"
            exit "$RC"
          fi

      - name: 失败自动诊断（关键错误直接显示在本页）
        if: failure()
        run: |
          set +e
          LOG="$GITHUB_WORKSPACE/gradle-build.log"
          {
            echo "## ❌ 构建失败自动诊断"
            echo ""
            echo "把下面这段截图发我即可定位原因；完整日志见同次运行的 Artifacts → build-failure-logs。"
            echo ""
            if [ -f "$LOG" ]; then
              echo "### 关键错误行（最多 60 条）"
              echo '```text'
              grep -nE '^\* What went wrong:|^> Task .*FAILED|^FAILURE:|^Caused by:|error:|Error:|fatal error:|ninja:|AAPT2|aapt2|SDK location not found|OutOfMemoryError|Java heap space|Execution failed for task|CXX1429|CMake Error|Could not|not found|NDK|FAIL|FileNotFoundException|keystore\.properties|bundleDebugJsAndAssets|bundleReleaseJsAndAssets|index\.android\.bundle|Unable to load script' "$LOG" | tail -n 60 || true
              echo '```'
              echo ""
              echo "### 日志末尾 40 行"
              echo '```text'
              tail -n 40 "$LOG"
              echo '```'
              DL=$(find "$HOME/.gradle/daemon" -name '*.out.log' -type f 2>/dev/null | sort | tail -1)
              if [ -n "$DL" ]; then
                echo ""
                echo "### Gradle daemon 日志末尾 30 行"
                echo '```text'
                tail -n 30 "$DL"
                echo '```'
              fi
            else
              echo '```text'
              echo "未生成 gradle-build.log —— 失败发生在编译之前的步骤，请看上方红色步骤的原始日志。"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传失败日志（Artifacts）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            gradle-build.log
            app/android/app/build/reports/**/*
            app/android/build/reports/**/*
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      - name: 归集并校验 32 位 APK
        run: |
          set -euo pipefail
          mkdir -p out
          ROOT="app/android/app/build/outputs/apk"
          [ -d "$ROOT" ] || { echo "::error::没有 APK 输出目录，构建可能失败"; exit 1; }
          PICK=$(find "$ROOT" -type f -name "*${ABI}*.apk" ! -name '*universal*' | head -1 || true)
          [ -n "$PICK" ] || PICK=$(find "$ROOT" -type f -name '*.apk' ! -name '*universal*' | head -1 || true)
          [ -n "$PICK" ] || PICK=$(find "$ROOT" -type f -name '*.apk' | head -1 || true)
          [ -n "$PICK" ] || { echo "::error::构建结束但没找到任何 APK"; exit 1; }
          echo "选中: $PICK"
          check_bundle() {
          python3 - "$1" <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          hit = [n for n in z.namelist()
                 if n == 'assets/index.android.bundle' or n.endswith('/index.android.bundle')]
          if not hit:
              print('::warning::APK 内缺 assets/index.android.bundle')
              sys.exit(1)
          info = z.getinfo(hit[0])
          print('JS bundle 校验通过: %s (%d bytes)' % (hit[0], info.file_size))
          if info.file_size < 10000:
              print('::warning::JS bundle 异常小，疑似空包')
              sys.exit(1)
          PY
          }
          python3 - "$PICK" "$ABI" <<'PY'
          import sys, zipfile
          apk, abi = sys.argv[1], sys.argv[2]
          z = zipfile.ZipFile(apk)
          libs = [n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')]
          if libs:
              hit = [n for n in libs if n.startswith('lib/%s/' % abi)]
              found = sorted(set(n.split('/')[1] for n in libs))
              if not hit:
                  print('::error::选中的 APK 不含 %s 原生库，不是目标架构：%s' % (abi, apk))
                  print('实际包含:', found)
                  sys.exit(1)
              print('ABI 校验通过: %s（包内架构: %s）' % (abi, found))
          else:
              print('::warning::APK 内未发现原生库，跳过 ABI 校验')
          PY
          if ! check_bundle "$PICK"; then
            echo "::warning::APK 缺 JS bundle，自动补打并重编一次"
            cd "$GITHUB_WORKSPACE/app"
            ENTRY=$(python3 - <<'PY'
          import json, os
          p = json.load(open('package.json', encoding='utf-8'))
          for c in [p.get('main') or '', 'index.js', 'index.android.js', 'src/index.js', 'src/main.js']:
              if c and os.path.isfile(c):
                  print(c); break
          else:
              print('index.js')
          PY
            )
            mkdir -p android/app/src/main/assets
            npx react-native bundle --platform android --dev false --entry-file "$ENTRY" --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/
            test -s android/app/src/main/assets/index.android.bundle || { echo "::error::补打的 JS bundle 仍为空"; exit 1; }
            # 清掉 Gradle 生成的同名产物，避免 mergeAssets 出现重复资源
            rm -rf android/app/build/generated/assets/react android/app/build/intermediates/assets
            cd android
            ARGS=$(cat "$GITHUB_WORKSPACE/gradle-args.txt")
            ./gradlew $ARGS 2>&1 | tee -a "$GITHUB_WORKSPACE/gradle-build.log"
            cd "$GITHUB_WORKSPACE"
            PICK=$(find "$ROOT" -type f -name "*${ABI}*.apk" ! -name '*universal*' | head -1 || true)
            [ -n "$PICK" ] || PICK=$(find "$ROOT" -type f -name '*.apk' ! -name '*universal*' | head -1 || true)
            [ -n "$PICK" ] || { echo "::error::重编后仍找不到 APK"; exit 1; }
            echo "选中(补打后): $PICK"
            check_bundle "$PICK" || { echo "::error::补打后 APK 仍缺 JS bundle，请把本次完整日志发我"; exit 1; }
          fi
          cp "$PICK" "out/lx-music-mobile-v1.9.2-${ABI}-${BUILD_TYPE}.apk"
          ls -lh out/

      - name: 上传 32 位 APK 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-${{ env.ABI }}-${{ env.BUILD_TYPE }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: 上传首次生成的签名（debug / release 均可固定复用）
        if: steps.prep.outputs.generated == '1'
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: app/android/app/lx-release.keystore
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: 发布到 Releases（无需打 tag，永久留存）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="lx-v1.9.2-${ABI}-${BUILD_TYPE}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
          else
            gh release create "$TAG" out/*.apk \
              --title "洛雪移动版 v1.9.2 ${ABI} ${BUILD_TYPE}" \
              --notes "GitHub Actions 自动构建；32 位 = armeabi-v7a；已校验 APK 内含 JS bundle。源码：仓库根目录的定制源码 zip。"
          fi
          echo "下载页: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
