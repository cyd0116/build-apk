name: Android 源码 → APK 通用自动构建

# 通用工作流：不绑定任何项目、任何版本号、任何定制改动。
# 适用：
#   - React Native 工程（含 android/ 子目录）
#   - 纯原生 Android Gradle 工程（根目录就是 gradlew）
#   - 源码以 zip 上传（GitHub tag zip / 定制 zip / 中文 GBK 文件名 zip 均可）
#   - 源码直接提交到仓库（不放 zip 也行）
# 提交到 main/master 即自动构建；Run workflow 只用于改参数或重跑，不是敲命令。

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '*.md'
  workflow_dispatch:
    inputs:
      source_zip:
        description: '(可选) 指定仓库根目录里的源码 zip 文件名；留空＝自动选最新的 zip'
        default: ''
      abi:
        description: '目标 CPU 架构（32 位 ARM = armeabi-v7a）'
        type: choice
        options: [armeabi-v7a, arm64-v8a, x86, x86_64]
        default: armeabi-v7a
      build_type:
        description: 'release 装手机可直接运行（默认）；debug 需连 Metro，仅调试用'
        type: choice
        options: [release, debug]
        default: release
      base_repo:
        description: '(可选) 源码缺 gradlew 时，用于补齐原生骨架的仓库 owner/repo'
        default: ''
      base_ref:
        description: '(可选) 补齐骨架用的分支或 tag'
        default: 'master'
      source_tag:
        description: '(可选) 源码 zip 作为某个 Release 附件上传时，填该 tag'
        default: ''
      android_dir:
        description: '(可选) android 工程相对路径，自动探测不准时填，如 app/android'
        default: ''
      label:
        description: '(可选) 产物名与 Release 标签的自定义后缀，便于区分不同定制版'
        default: ''

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ABI: ${{ inputs.abi || 'armeabi-v7a' }}
      BUILD_TYPE: ${{ inputs.build_type || 'release' }}
      BASE_REPO: ${{ inputs.base_repo || '' }}
      BASE_REF: ${{ inputs.base_ref || 'master' }}
      SOURCE_TAG: ${{ inputs.source_tag || '' }}
      SOURCE_ZIP: ${{ inputs.source_zip || '' }}
      ANDROID_DIR_HINT: ${{ inputs.android_dir || '' }}
      LABEL: ${{ inputs.label || '' }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 定位源码并自动探测工程（通用）
        id: locate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          newest_zip() {
            find . -maxdepth 1 -type f -name '*.zip' -printf '%T@ %p\n' 2>/dev/null \
              | sort -nr | head -1 | cut -d' ' -f2- | sed 's|^\./||' || true
          }
          ZIP=""
          if [ -n "$SOURCE_ZIP" ]; then
            [ -f "$SOURCE_ZIP" ] || { echo "::error::指定的源码包不存在：$SOURCE_ZIP"; exit 1; }
            ZIP="$SOURCE_ZIP"
          else
            ZIP="$(newest_zip)"
          fi
          if [ -z "$ZIP" ] && [ -n "$SOURCE_TAG" ]; then
            gh release download "$SOURCE_TAG" --pattern '*.zip' --dir . --clobber || true
            ZIP="$(newest_zip)"
          fi
          if [ -z "$ZIP" ] && [ -z "$SOURCE_TAG" ]; then
            gh release download --pattern '*.zip' --dir . --clobber || true
            ZIP="$(newest_zip)"
          fi

          if [ -n "$ZIP" ]; then
            echo "使用源码包：$ZIP"
            python3 - "$ZIP" <<'PY'
          import sys, zipfile, os, shutil
          z = zipfile.ZipFile(sys.argv[1])
          out = os.path.abspath('src_tmp')
          shutil.rmtree(out, ignore_errors=True)
          os.makedirs(out)
          for info in z.infolist():
              name = info.filename
              # 兼容 Windows/GBK 编码的中文文件名
              if not (info.flag_bits & 0x800):
                  try:
                      name = name.encode('cp437').decode('gbk')
                  except Exception:
                      pass
              name = name.replace('\\', '/')
              parts = [p for p in name.split('/') if p not in ('', '.', '..')]
              if not parts:
                  continue
              target = os.path.join(out, *parts)
              if info.is_dir():
                  os.makedirs(target, exist_ok=True)
                  continue
              os.makedirs(os.path.dirname(target), exist_ok=True)
              with z.open(info) as s, open(target, 'wb') as d:
                  shutil.copyfileobj(s, d)
          print('解压完成')
          PY
            ROOT=$(python3 - <<'PY'
          import os
          root = os.path.abspath('src_tmp')
          cands = []
          for d, dirs, fs in os.walk(root):
              dirs[:] = [x for x in dirs if x not in ('node_modules', '.git', '.gradle', 'build')]
              if 'package.json' in fs or 'gradlew' in fs or any(x.startswith('settings.gradle') for x in fs):
                  cands.append(d)
          cands.sort(key=lambda p: (p.count(os.sep), len(p)))
          print(cands[0] if cands else '')
          PY
            )
            [ -n "$ROOT" ] || { echo "::error::zip 里找不到工程根（package.json / gradlew / settings.gradle）"; exit 1; }
            rm -rf "$GITHUB_WORKSPACE/app"
            mv "$ROOT" "$GITHUB_WORKSPACE/app"
            rm -rf src_tmp
            SRC_ROOT=app
          else
            # 没有 zip：仓库工作区本身就是源码工程
            if [ -f package.json ] || [ -f gradlew ] || [ -f settings.gradle ] || [ -f settings.gradle.kts ] || [ -f android/gradlew ]; then
              echo "未发现 zip，直接使用仓库工作区源码"
              SRC_ROOT=.
            else
              echo "::error::未找到源码。请把源码 zip 上传到仓库根目录，或直接把工程文件提交进来；也可以在 Run workflow 里填 source_tag / source_zip"
              exit 1
            fi
          fi

          # 统一探测：工程类型、gradle 目录、版本号、JS 入口、JDK、compileSdk、NDK
          python3 - "$SRC_ROOT" "$ANDROID_DIR_HINT" "$ZIP" <<'PY'
          import os, sys, json, re

          src, hint, zip_name = sys.argv[1], sys.argv[2], sys.argv[3]
          ws = os.path.abspath('.')
          base = os.path.abspath(src)
          skip = {'node_modules', '.git', '.gradle', 'build', '.cxx', 'src_tmp', '.github'}

          def walk_files():
              for d, dirs, fs in os.walk(base):
                  dirs[:] = [x for x in dirs if x not in skip]
                  yield d, fs

          def read(p):
              try:
                  return open(p, encoding='utf-8', errors='ignore').read()
              except Exception:
                  return ''

          def rel(p):
              return os.path.relpath(p, ws).replace(os.sep, '/')

          # --- gradle 工程根 ---
          gradle_roots = [d for d, fs in walk_files()
                          if 'gradlew' in fs or any(x.startswith('settings.gradle') for x in fs)]
          gradle_roots.sort(key=lambda p: (p.count(os.sep), len(p)))
          if hint:
              h = os.path.abspath(os.path.join(base, hint))
              if os.path.isdir(h):
                  android = h
              elif gradle_roots:
                  android = gradle_roots[0]
              else:
                  android = os.path.join(base, 'android')
          else:
              android = gradle_roots[0] if gradle_roots else os.path.join(base, 'android')
          has_gradlew = os.path.isfile(os.path.join(android, 'gradlew'))

          # --- JS 根 / 是否 React Native ---
          pkg_dirs = [d for d, fs in walk_files() if 'package.json' in fs]
          pkg_dirs.sort(key=lambda p: (p.count(os.sep), len(p)))
          js_root = pkg_dirs[0] if pkg_dirs else base
          pkg = {}
          try:
              pkg = json.loads(read(os.path.join(js_root, 'package.json')))
          except Exception:
              pass
          deps = {**pkg.get('dependencies', {}), **pkg.get('devDependencies', {})}
          is_rn = 'react-native' in deps or os.path.isdir(os.path.join(js_root, 'node_modules', 'react-native'))
          if os.path.isfile(os.path.join(js_root, 'react-native.config.js')):
              is_rn = True

          # --- 版本号 ---
          version = str(pkg.get('version') or '')
          if not version:
              for name in ('build.gradle', 'build.gradle.kts', 'app/build.gradle', 'app/build.gradle.kts'):
                  m = re.search(r'versionName\s*[= ]\s*["\']([^"\']+)["\']', read(os.path.join(android, name)))
                  if m:
                      version = m.group(1)
                      break
          version = re.sub(r'[^A-Za-z0-9._-]', '-', version) or '0.0.0'

          # --- 工程名（用于产物文件名） ---
          project = str(pkg.get('name') or os.path.basename(base) or 'app')
          project = re.sub(r'[^A-Za-z0-9._-]', '-', project).strip('-') or 'app'

          # --- JS 入口 ---
          entry = ''
          for c in [pkg.get('main') or '', 'index.js', 'index.android.js', 'src/index.js', 'src/main.js']:
              if c and os.path.isfile(os.path.join(js_root, c)):
                  entry = os.path.relpath(os.path.join(js_root, c), base).replace(os.sep, '/')
                  break
          if not entry:
              entry = 'index.js'

          # --- JDK 版本按 Gradle 版本推断 ---
          jdk = '17'
          wrapper = read(os.path.join(android, 'gradle', 'wrapper', 'gradle-wrapper.properties'))
          m = re.search(r'gradle-(\d+)\.(\d+)', wrapper)
          if m:
              major = int(m.group(1))
              jdk = '11' if major <= 7 else '17'

          # --- compileSdk / ndkVersion（尽量尊重项目声明） ---
          gradle_text = ''.join(read(os.path.join(android, n)) for n in
                               ('build.gradle', 'build.gradle.kts', 'app/build.gradle', 'app/build.gradle.kts',
                                'gradle/libs.versions.toml'))
          cs = [int(x) for x in re.findall(r'compileSdk(?:Version)?\s*[= ]\s*["\']?(\d{2})', gradle_text)]
          compile_sdk = str(max(cs)) if cs else '35'
          m = re.search(r'ndkVersion\s+["\']([^"\']+)["\']', gradle_text)
          ndk_version = m.group(1) if m else '26.1.10909125'

          out = {
              'src_root': rel(base),
              'android_dir': rel(android),
              'js_root': rel(js_root),
              'is_rn': 'true' if is_rn else 'false',
              'has_gradlew': 'true' if has_gradlew else 'false',
              'version': version,
              'project': project,
              'entry': entry,
              'jdk_version': jdk,
              'compile_sdk': compile_sdk,
              'ndk_version': ndk_version,
              'zip_name': zip_name or '(工作区源码)',
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              for k, v in out.items():
                  f.write('%s=%s\n' % (k, v))
          for k, v in out.items():
              print('%-14s %s' % (k + ':', v))
          PY
          # 部分 C++ 原生模块不能在中文路径下编译
          python3 - "$SRC_ROOT" <<'PY'
          import os, sys
          p = os.path.abspath(sys.argv[1])
          try:
              p.encode('ascii')
          except UnicodeEncodeError:
              print('::error::工程路径含非 ASCII 字符，请把 GitHub 仓库名改成英文')
              sys.exit(1)
          print('工程路径(纯 ASCII):', p)
          PY

      - name: 补齐原生工程骨架（仅当源码缺 gradlew）
        if: steps.locate.outputs.has_gradlew != 'true'
        env:
          SRC_ROOT: ${{ steps.locate.outputs.src_root }}
          ANDROID_DIR: ${{ steps.locate.outputs.android_dir }}
        run: |
          set -euo pipefail
          [ -n "$BASE_REPO" ] || {
            echo "::error::源码里没有 gradlew。请上传完整工程，或在 Run workflow 里填 base_repo（owner/repo）与 base_ref 用于补齐骨架"
            exit 1
          }
          echo "从 $BASE_REPO@$BASE_REF 补齐原生骨架"
          BASE_OK=0
          for REF in "$BASE_REF" master main; do
            [ -n "$REF" ] || continue
            if curl -fsSL "https://codeload.github.com/$BASE_REPO/zip/refs/tags/$REF" -o /tmp/base.zip 2>/dev/null; then
              echo "骨架来源：tag $REF"; BASE_OK=1; break
            fi
            if curl -fsSL "https://codeload.github.com/$BASE_REPO/zip/refs/heads/$REF" -o /tmp/base.zip 2>/dev/null; then
              echo "骨架来源：branch $REF"; BASE_OK=1; break
            fi
          done
          [ "$BASE_OK" = "1" ] || { echo "::error::骨架下载失败，检查 base_repo / base_ref"; exit 1; }
          rm -rf /tmp/base && mkdir -p /tmp/base
          unzip -q -o /tmp/base.zip -d /tmp/base
          BASE=$(python3 - <<'PY'
          import os
          hits = [d for d, _, f in os.walk('/tmp/base') if 'gradlew' in f]
          hits.sort(key=lambda p: (p.count(os.sep), len(p)))
          print(hits[0] if hits else '')
          PY
          )
          [ -n "$BASE" ] || { echo "::error::骨架 zip 里找不到 gradlew"; exit 1; }
          mkdir -p "$ANDROID_DIR/gradle/wrapper"
          # 只补缺失，绝不覆盖源码自带文件
          cp -rn "$BASE/." "$ANDROID_DIR/" 2>/dev/null || true
          [ -f "$ANDROID_DIR/gradlew" ] || cp -n "$BASE/gradlew" "$ANDROID_DIR/gradlew"
          chmod +x "$ANDROID_DIR/gradlew" 2>/dev/null || true
          [ -f "$ANDROID_DIR/gradlew" ] || { echo "::error::原生骨架补齐失败"; exit 1; }
          echo "骨架补齐完成（源码文件未被覆盖）"

      - name: Node 20（仅 JS 工程）
        if: steps.locate.outputs.is_rn == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 npm 依赖（仅 JS 工程）
        if: steps.locate.outputs.is_rn == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles(format('{0}/package-lock.json', steps.locate.outputs.js_root), format('{0}/package.json', steps.locate.outputs.js_root)) }}
          restore-keys: ${{ runner.os }}-npm-

      - name: 安装 JS 依赖（仅 JS 工程）
        if: steps.locate.outputs.is_rn == 'true'
        working-directory: ${{ steps.locate.outputs.js_root }}
        run: |
          set -e
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          # 可选脚本：项目没定义就跳过
          npm run sync-app-name || true

      - name: 预打 JS bundle（debug + RN 专属）
        if: steps.locate.outputs.is_rn == 'true' && env.BUILD_TYPE == 'debug'
        env:
          ANDROID_DIR: ${{ steps.locate.outputs.android_dir }}
          ENTRY: ${{ steps.locate.outputs.entry }}
        working-directory: ${{ steps.locate.outputs.src_root }}
        run: |
          set -euo pipefail
          echo "入口文件：$ENTRY"
          mkdir -p "$ANDROID_DIR/app/src/main/assets" "$ANDROID_DIR/app/src/main/res"
          npx react-native bundle --platform android --dev false --entry-file "$ENTRY" \
            --bundle-output "$ANDROID_DIR/app/src/main/assets/index.android.bundle" \
            --assets-dest "$ANDROID_DIR/app/src/main/res/"
          test -s "$ANDROID_DIR/app/src/main/assets/index.android.bundle" || { echo "::error::JS bundle 生成失败或为空"; exit 1; }
          ls -lh "$ANDROID_DIR/app/src/main/assets/index.android.bundle"

      - name: JDK（按 Gradle 版本自动选 11 / 17）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.locate.outputs.jdk_version }}

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 补齐 Android SDK 组件（按项目声明）
        env:
          COMPILE_SDK: ${{ steps.locate.outputs.compile_sdk }}
          NDK_VERSION: ${{ steps.locate.outputs.ndk_version }}
        run: |
          set -e
          SDKM=$(find "$ANDROID_HOME" -path '*/cmdline-tools/*/bin/sdkmanager' 2>/dev/null | head -1 || true)
          if [ -z "$SDKM" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmd.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            unzip -q -o /tmp/cmd.zip -d /tmp/cmd
            mv /tmp/cmd/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          # 单项安装、单项容错：不同版本项目需要的组件不同，缺哪个都不中断整体构建
          "$SDKM" "platforms;android-$COMPILE_SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          "$SDKM" "ndk;$NDK_VERSION" "cmake;3.22.1" || true
          echo "SDK 组件准备完毕（compileSdk=$COMPILE_SDK, ndk=$NDK_VERSION）"

      - name: 准备签名配置（零 Secrets 也能跑）
        id: prep
        working-directory: ${{ steps.locate.outputs.android_dir }}
        env:
          LX_KEYSTORE_B64: ${{ secrets.LX_KEYSTORE_B64 }}
        run: |
          set -e
          KS="$PWD/ci-release.keystore"
          if [ -n "$LX_KEYSTORE_B64" ]; then
            echo "$LX_KEYSTORE_B64" | base64 -d > "$KS"
            echo "generated=0" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore "$KS" -alias lxkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass lxci2026 -keypass lxci2026 \
              -dname "CN=Android CI, OU=CI, O=Self, L=Shenzhen, ST=GD, C=CN"
            echo "generated=1" >> "$GITHUB_OUTPUT"
          fi
          PROPS=$(printf 'storeFile=%s\nstorePassword=lxci2026\nkeyAlias=lxkey\nkeyPassword=lxci2026\nMYAPP_UPLOAD_STORE_FILE=%s\nMYAPP_UPLOAD_STORE_PASSWORD=lxci2026\nMYAPP_UPLOAD_KEY_ALIAS=lxkey\nMYAPP_UPLOAD_KEY_PASSWORD=lxci2026\n' "$KS" "$KS")
          printf '%s\n' "$PROPS" > keystore.properties
          # 有的项目从 app/ 目录读 properties，多放一份不影响其他项目
          [ -d app ] && printf '%s\n' "$PROPS" > app/keystore.properties || true
          test -s keystore.properties || { echo "::error::keystore.properties 未生成"; exit 1; }
          test -f "$KS" || { echo "::error::签名库不存在：$KS"; exit 1; }
          echo "ks=$KS" >> "$GITHUB_OUTPUT"
          echo "签名配置就绪：$KS"

      - name: 编译 APK
        working-directory: ${{ steps.locate.outputs.android_dir }}
        env:
          IS_RN: ${{ steps.locate.outputs.is_rn }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          touch gradle.properties
          python3 - <<'PY'
          import os
          p = 'gradle.properties'
          with open(p, encoding='utf-8') as f:
              lines = f.readlines()
          # 尊重项目已有配置，只补缺失项
          has_rn = any(l.startswith('reactNativeArchitectures=') for l in lines)
          has_jvm = any(l.startswith('org.gradle.jvmargs=') for l in lines)
          if os.environ.get('IS_RN') == 'true' and not has_rn:
              lines.append('reactNativeArchitectures=%s\n' % os.environ['ABI'])
          if not has_jvm:
              lines.append('org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n')
          with open(p, 'w', encoding='utf-8') as f:
              f.writelines(lines)
          PY
          ARGS="--no-daemon --stacktrace"
          if [ "$IS_RN" = "true" ]; then ARGS="$ARGS -PreactNativeArchitectures=$ABI"; fi
          if [ "$BUILD_TYPE" = "release" ]; then
            ARGS="$ARGS assembleRelease"
            # 只有项目确实引用了上传签名变量时才传，避免污染不相关的工程
            if grep -rql 'MYAPP_UPLOAD\|keystore.properties' --include='*.gradle' --include='*.gradle.kts' . 2>/dev/null; then
              KS='${{ steps.prep.outputs.ks }}'
              ARGS="$ARGS -PMYAPP_UPLOAD_STORE_FILE=$KS -PMYAPP_UPLOAD_STORE_PASSWORD=lxci2026 -PMYAPP_UPLOAD_KEY_ALIAS=lxkey -PMYAPP_UPLOAD_KEY_PASSWORD=lxci2026"
            fi
          else
            ARGS="$ARGS assembleDebug"
          fi
          echo "构建命令：./gradlew $ARGS"
          printf '%s\n' "$ARGS" > "$GITHUB_WORKSPACE/gradle-args.txt"
          set +e
          ./gradlew $ARGS 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::error::Gradle 退出码 $RC；关键错误见本页摘要，完整日志见 Artifacts"
            exit "$RC"
          fi

      - name: 失败自动诊断（关键错误直接显示在本页）
        if: failure()
        run: |
          set +e
          LOG="$GITHUB_WORKSPACE/gradle-build.log"
          {
            echo "## ❌ 构建失败自动诊断"
            echo ""
            echo "把下面这段截图发我即可定位原因；完整日志见同次运行的 Artifacts → build-failure-logs。"
            echo ""
            if [ -f "$LOG" ]; then
              echo "### 关键错误行（最多 60 条）"
              echo '```text'
              grep -nE '^\* What went wrong:|^> Task .*FAILED|^FAILURE:|^Caused by:|error:|Error:|fatal error:|ninja:|AAPT2|aapt2|SDK location not found|OutOfMemoryError|Java heap space|Execution failed for task|CXX1429|CMake Error|Could not|not found|NDK|FAIL|FileNotFoundException|keystore\.properties|bundleDebugJsAndAssets|bundleReleaseJsAndAssets|index\.android\.bundle|Unable to load script' "$LOG" | tail -n 60 || true
              echo '```'
              echo ""
              echo "### 日志末尾 40 行"
              echo '```text'
              tail -n 40 "$LOG"
              echo '```'
              DL=$(find "$HOME/.gradle/daemon" -name '*.out.log' -type f 2>/dev/null | sort | tail -1)
              if [ -n "$DL" ]; then
                echo ""
                echo "### Gradle daemon 日志末尾 30 行"
                echo '```text'
                tail -n 30 "$DL"
                echo '```'
              fi
            else
              echo '```text'
              echo "未生成 gradle-build.log —— 失败发生在编译之前的步骤，请看上方红色步骤的原始日志。"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传失败日志（Artifacts）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            gradle-build.log
            **/build/reports/**/*
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      - name: 归集并校验 APK
        env:
          ANDROID_DIR: ${{ steps.locate.outputs.android_dir }}
          SRC_ROOT: ${{ steps.locate.outputs.src_root }}
          IS_RN: ${{ steps.locate.outputs.is_rn }}
          VERSION: ${{ steps.locate.outputs.version }}
          PROJECT: ${{ steps.locate.outputs.project }}
          ENTRY: ${{ steps.locate.outputs.entry }}
        run: |
          set -euo pipefail
          mkdir -p out
          find_apk() {
            find "$ANDROID_DIR" -type f -name '*.apk' -path '*/build/outputs/apk/*' "$@" 2>/dev/null | sort | head -1 || true
          }
          PICK=$(find_apk -name "*${ABI}*.apk" ! -name '*universal*' ! -name '*unsigned*')
          [ -n "$PICK" ] || PICK=$(find_apk ! -name '*universal*' ! -name '*unsigned*')
          [ -n "$PICK" ] || PICK=$(find_apk)
          [ -n "$PICK" ] || { echo "::error::构建结束但没找到任何 APK"; exit 1; }
          echo "选中：$PICK"

          check_bundle() {
            python3 - "$1" <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          hit = [n for n in z.namelist()
                 if n == 'assets/index.android.bundle' or n.endswith('/index.android.bundle')]
          if not hit:
              print('::warning::APK 内缺 assets/index.android.bundle')
              sys.exit(1)
          info = z.getinfo(hit[0])
          print('JS bundle 校验通过：%s (%d bytes)' % (hit[0], info.file_size))
          if info.file_size < 10000:
              print('::warning::JS bundle 异常小，疑似空包')
              sys.exit(1)
          PY
          }
          python3 - "$PICK" "$ABI" "$IS_RN" <<'PY'
          import sys, zipfile
          apk, abi, is_rn = sys.argv[1], sys.argv[2], sys.argv[3]
          z = zipfile.ZipFile(apk)
          libs = [n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')]
          if libs:
              hit = [n for n in libs if n.startswith('lib/%s/' % abi)]
              found = sorted(set(n.split('/')[1] for n in libs))
              if not hit:
                  msg = 'APK 不含 %s 原生库，实际包含：%s' % (abi, found)
                  print('::error::%s' % msg if is_rn == 'true' else '::warning::%s' % msg)
                  sys.exit(1 if is_rn == 'true' else 0)
              print('ABI 校验通过：%s（包内架构：%s）' % (abi, found))
          else:
              print('APK 内未发现原生库，跳过 ABI 校验')
          PY

          if [ "$IS_RN" = "true" ]; then
            if ! check_bundle "$PICK"; then
              echo "::warning::APK 缺 JS bundle，自动补打并重编一次"
              cd "$GITHUB_WORKSPACE/$SRC_ROOT"
              mkdir -p "$GITHUB_WORKSPACE/$ANDROID_DIR/app/src/main/assets" "$GITHUB_WORKSPACE/$ANDROID_DIR/app/src/main/res"
              npx react-native bundle --platform android --dev false --entry-file "$ENTRY" \
                --bundle-output "$GITHUB_WORKSPACE/$ANDROID_DIR/app/src/main/assets/index.android.bundle" \
                --assets-dest "$GITHUB_WORKSPACE/$ANDROID_DIR/app/src/main/res/"
              test -s "$GITHUB_WORKSPACE/$ANDROID_DIR/app/src/main/assets/index.android.bundle" || { echo "::error::补打的 JS bundle 仍为空"; exit 1; }
              rm -rf "$GITHUB_WORKSPACE/$ANDROID_DIR/app/build/generated/assets/react" "$GITHUB_WORKSPACE/$ANDROID_DIR/app/build/intermediates/assets"
              cd "$GITHUB_WORKSPACE/$ANDROID_DIR"
              ARGS=$(cat "$GITHUB_WORKSPACE/gradle-args.txt")
              ./gradlew $ARGS 2>&1 | tee -a "$GITHUB_WORKSPACE/gradle-build.log"
              cd "$GITHUB_WORKSPACE"
              PICK=$(find_apk -name "*${ABI}*.apk" ! -name '*universal*' ! -name '*unsigned*')
              [ -n "$PICK" ] || PICK=$(find_apk ! -name '*universal*' ! -name '*unsigned*')
              [ -n "$PICK" ] || PICK=$(find_apk)
              [ -n "$PICK" ] || { echo "::error::重编后仍找不到 APK"; exit 1; }
              echo "选中(补打后)：$PICK"
              check_bundle "$PICK" || { echo "::error::补打后 APK 仍缺 JS bundle，请把本次完整日志发我"; exit 1; }
            fi
          else
            echo "非 JS 工程，跳过 JS bundle 校验"
          fi

          NAME="${PROJECT}-${VERSION}"
          [ -n "$LABEL" ] && NAME="$NAME-$LABEL"
          cp "$PICK" "out/$NAME-$ABI-$BUILD_TYPE.apk"
          ls -lh out/

      - name: 上传 APK 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ env.ABI }}-${{ env.BUILD_TYPE }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: 上传首次生成的签名（可固定复用）
        if: steps.prep.outputs.generated == '1'
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: ${{ steps.locate.outputs.android_dir }}/ci-release.keystore
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: 发布到 Releases（无需打 tag，永久留存）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.locate.outputs.version }}
          PROJECT: ${{ steps.locate.outputs.project }}
          IS_RN: ${{ steps.locate.outputs.is_rn }}
          ZIP_NAME: ${{ steps.locate.outputs.zip_name }}
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="apk-${VERSION}-${ABI}-${BUILD_TYPE}"
            [ -n "$LABEL" ] && TAG="$TAG-$LABEL"
          fi
          NOTES="GitHub Actions 通用自动构建｜源码：${ZIP_NAME}｜工程：${PROJECT}｜版本：${VERSION}｜架构：${ABI}｜类型：${BUILD_TYPE}｜commit：${GITHUB_SHA::7}。"
          if [ "$IS_RN" = "true" ]; then NOTES="$NOTES 已校验 APK 内含 JS bundle。"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
          else
            gh release create "$TAG" out/*.apk \
              --title "${PROJECT} ${VERSION} ${ABI} ${BUILD_TYPE}" \
              --notes "$NOTES"
          fi
          echo "下载页：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

